<!doctype html>
<html><head><meta charset="utf-8"><title>本页会话</title></head>
<body style="margin:0"><script type="module">
import bridge from "./bridge.js";
const hostOrigin = window.location.origin;
function send(type, values) {
    window.parent.postMessage({isStreamlitMessage: true, type, ...values}, hostOrigin);
}
window.addEventListener("message", event => {
    if (event.source !== window.parent || event.origin !== hostOrigin || event.data?.type !== "streamlit:render") return;
    bridge({ data: event.data.args.data, setStateValue: (_name, value) =>
        send("streamlit:setComponentValue", {value, dataType: "json"}) });
});
send("streamlit:componentReady", {apiVersion: 1});
send("streamlit:setFrameHeight", {height: 0});
</script></body></html>
